<script>
    // صاعق منع الخروج: إذا تجسس المتصفح على أي محاولة انتقال لرابط جوجل، امنعها فوراً
    (function() {
        if (window.location.href.includes("script.google.com")) {
            window.location.replace("./index.html");
        }
        
        // مراقبة دائم لتاريخ المتصفح ومنع أي تلاعب بالروابط
        window.addEventListener('popstate', function(event) {
            if (window.location.href.includes("script.google.com")) {
                window.history.pushState(null, "", "./index.html");
                window.location.replace("./index.html");
            }
        });
    })();
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EIPI Factory ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div class="container-fluid py-3" id="app">
        <!-- شريط التنقل العلوي الآمن محلياً -->
        <nav class="navbar navbar-dark bg-primary rounded-3 shadow-sm mb-3 px-3 d-flex justify-content-between align-items-center">
            <button type="button" class="btn text-white fw-bold p-0 border-0 bg-transparent" onclick="localNavigate('home-view')">
                <i class="fas fa-industry ms-2"></i> نظام إدارة المصنع - ERP
            </button>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-light btn-sm" onclick="localNavigate('other-view')">
                    <i class="fas fa-list"></i>
                </button>
                <button type="button" class="btn btn-outline-light btn-sm" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </nav>

        <!-- واجهة الرئيسية -->
        <div id="home-view" class="view-section active card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">لوحة المؤشرات</h4>
            <div class="row g-3">
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3 border text-center">
                        <span class="text-muted small">حالة النظام</span>
                        <h5 class="fw-bold text-success mb-0">متصل محلياً</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- واجهة فرعية للتنقل -->
        <div id="other-view" class="view-section card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">العمليات</h4>
            <button type="button" class="btn btn-secondary btn-sm" onclick="localNavigate('home-view')">
                <i class="fas fa-home ms-1"></i> العودة للرئيسية
            </button>
        </div>
    </div>

    <script>
        // التنقل المحلي المحض داخل جيت هاب (ممنوع منعاً باتاً فتح أي رابط خارجي)
        function localNavigate(viewId) {
            document.querySelectorAll('.view-section').forEach(function(section) {
                section.classList.remove('active');
            });
            var target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active');
            }
        }

        function loadData() {
            // يمكن وضع استدعاء الـ fetch هنا لاحقاً إذا أردت جلب بيانات صامتة
            console.log("Local refresh triggered");
        }

        // حماية عامة تمنع أي رابط من تغيير مسار الصفحة إلى دومين خارجي
        document.addEventListener('click', function(e) {
            var targetLink = e.target.closest('a');
            if (targetLink) {
                e.preventDefault();
            }
        }, true);
    </script>
</body>
</html>
