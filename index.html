<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الإدارة المتكامل - ERP</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }
        .app-container {
            max-width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* إخفاء شريط التمرير المزعج وتجربة تطبيق حقيقي */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- شاشة التحميل الأولية (Splash Screen) -->
        <div id="splash-screen" class="d-flex flex-column justify-content-center align-items-center vh-100 bg-primary text-white">
            <div class="spinner-border text-light mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <h5 class="fw-bold">جاري تحميل نظام الـ ERP...</h5>
        </div>

        <!-- المحتوى الرئيسي للتطبيق -->
        <div id="main-content" class="d-none flex-grow-1 p-3">
            <nav class="navbar navbar-dark bg-primary rounded-3 shadow-sm mb-3 px-3">
                <span class="navbar-brand mb-0 h1"><i class="fas fa-boxes-stacked ms-2"></i> نظام الإدارة الشامل</span>
                <button class="btn btn-outline-light btn-sm" onclick="app.refreshData()"><i class="fas fa-sync-alt"></i></button>
            </nav>

            <div id="dynamic-view" class="card border-0 shadow-sm p-3 rounded-4">
                <!-- سيتم حقن الواجهات هنا ديناميكياً عبر JavaScript -->
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>

    <!-- التطبيق البرمجي الواجهة -->
    <script>
        const CONFIG = {
    // رابط الـ Web App الخاص بك في جوجل سكريبت
    API_URL: "https://script.google.com/macros/s/AKfycbzXx524tqoCw_EiaVxB0hsxcT2i4nnfBiqt7v8mHxYzvymBd9vGsFux8Qeh8CVqBGiKgA/exec"
};

// دالة الاتصال الموحدة والآمنة (لا تغادر جيت هاب أبداً)
async function callGAS(action, payload = {}) {
    try {
        const response = await fetch(CONFIG.API_URL, {
            method: "POST",
            // استخدام text/plain ضروري جداً مع جوجل سكريبت لمنع طلبات الـ OPTIONS المعقدة وكسر الـ CORS
            headers: {
                "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify({ action: action, ...payload })
        });

        const result = await response.json();
        return result;
    } catch (error) {
        console.error("Communication Error:", error);
        return { status: "error", message: "فشل الاتصال بالخادم الداخلي" };
    }
}

// مثال على جلب أو إرسال بيانات من واجهة الجيت هاب بسلاسة تامة:
async function loadERPData() {
    // إظهار مؤشر تحميل محلي داخل الصفحة دون إعادة تحميل
    document.getElementById('dynamic-view').innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
    
    const res = await callGAS("getDashboardData");
    
    if(res.status === "success") {
        // تحديث الواجهة محلياً
        renderView(res.data);
    }
}
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
