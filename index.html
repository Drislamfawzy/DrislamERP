<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drislam ERP</title>
    
    <!-- إعدادات التثبيت كبرنامج على الأندرويد -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- إعدادات التثبيت كبرنامج على الآيفون (iOS Safari PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Drislam ERP">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2821/2821812.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            position: fixed; /* يمنع اهتزاز الشاشة أو سحبها للأعلى والأسفل في الموبايل */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="erpFrame" src="https://script.google.com/macros/s/AKfycbzXx524tqoCw_EiaVxB0hsxcT2i4nnfBiqt7v8mHxYzvymBd9vGsFux8Qeh8CVqBGiKgA/exec"></iframe>

    <script>
        // منع أي محاولة للخروج من الإطار أو فتح روابط خارجية بشكل غير مقصود
        window.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.target === '_blank') {
                link.target = '_self';
            }
        });
    </script>
</body>
</html>
