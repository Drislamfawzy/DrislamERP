<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EIPI Factory ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div class="container-fluid py-3" id="app">
        <nav class="navbar navbar-dark bg-primary rounded-3 shadow-sm mb-3 px-3 d-flex justify-content-between align-items-center">
            <button type="button" class="btn text-white fw-bold p-0 border-0 bg-transparent" onclick="switchView('home-view')">
                <i class="fas fa-industry ms-2"></i> نظام إدارة المصنع - ERP
            </button>
            <button type="button" class="btn btn-outline-light btn-sm" onclick="switchView('other-view')">
                <i class="fas fa-list"></i> الحركات
            </button>
        </nav>

        <div id="home-view" class="view-section active card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">لوحة المؤشرات (وضع الاستقرار التام)</h4>
            <div class="p-3 bg-light rounded-3 border text-center">
                <h5 class="fw-bold text-success mb-0">التطبيق يعمل داخل جيت هاب بنجاح ولن يخرج أبدًا</h5>
            </div>
        </div>

        <div id="other-view" class="view-section card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">سجل العمليات المحلي</h4>
            <button type="button" class="btn btn-secondary btn-sm" onclick="switchView('home-view')">
                <i class="fas fa-home ms-1"></i> العودة للرئيسية
            </button>
        </div>
    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(function(section) {
                section.classList.remove('active');
            });
            var target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
</body>
</html>
