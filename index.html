<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EIPI Factory ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
    <!-- حماية قاطعة: منع أي تغيير في مسار الـ URL نهائياً -->
    <script>
        (function() {
            if (window.location.href.includes("script.google.com")) {
                window.location.replace("https://drislamfawzy.github.io/DrislamERP/"); // استبدل هذا برابط جيت هاب الخاص بك إذا لزم الأمر
            }
        })();
    </script>
</head>
<body>

    <div class="container-fluid py-3" id="app">
        <!-- شريط التنقل العلوي -->
        <nav class="navbar navbar-dark bg-primary rounded-3 shadow-sm mb-3 px-3 d-flex justify-content-between align-items-center">
            <button type="button" class="btn text-white fw-bold p-0 border-0 bg-transparent" onclick="switchView('home-view')">
                <i class="fas fa-industry ms-2"></i> نظام إدارة المصنع - ERP
            </button>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-light btn-sm" onclick="switchView('transactions-view')">
                    <i class="fas fa-list"></i> الحركات
                </button>
                <button type="button" class="btn btn-outline-light btn-sm" onclick="alert('التطبيق يعمل محلياً بكفاءة')">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </nav>

        <!-- واجهة الرئيسية -->
        <div id="home-view" class="view-section active card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">لوحة المؤشرات الرئيسية</h4>
            <div class="row g-3">
                <div class="col-6">
                    <div class="p-3 bg-light rounded-3 border text-center">
                        <span class="text-muted small">حالة التشغيل</span>
                        <h5 class="fw-bold text-success mb-0">مستقر محلياً</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- واجهة الحركات -->
        <div id="transactions-view" class="view-section card border-0 shadow-sm p-3 rounded-4">
            <h4 class="text-secondary mb-3">سجل العمليات</h4>
            <button type="button" class="btn btn-secondary btn-sm" onclick="switchView('home-view')">
                <i class="fas fa-home ms-1"></i> العودة للرئيسية
            </button>
        </div>
    </div>

    <script>
        // التنقل البصري المحلي البحت (لا يرسل أي طلبات لخادم جوجل قد تسبب إعادة توجيه)
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(function(section) {
                section.classList.remove('active');
            });
            var target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active');
            }
        }

        // اعتراض أي محاولة خروج لعنوان جوجل واحتجازها بالقوة
        window.addEventListener('popstate', function(e) {
            if (window.location.href.includes("script.google.com")) {
                history.pushState(null, "", window.location.pathname);
            }
        });
    </script>
</body>
</html>
