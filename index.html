<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drislam ERP - System</title>
    
    <!-- إعدادات التخزين المؤقت والأيقونات -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2821/2821812.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>جاري توجيهك إلى نظام Drislam ERP...</h2>
    <p>إذا لم يتم التحويل تلقائياً خلال ثوانٍ، اضغط على الرابط أدناه:</p>
    <a id="directLink" href="#">فتح النظام مباشرة</a>

    <script>
        // ضع رابط الـ Web App الثابت الخاص بك هنا (الذي ينتهي بـ /exec)
        const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbzt4-lrDhUeX_igifz-iMRUWPhj9FAAySG4hYAtX76wCg9GDFeQl0fx5RZol4F-KkXAOw/exec";

        // ربط الرابط الاحتياطي
        document.getElementById('directLink').href = GAS_EXEC_URL;

        // التوجيه الفوري والسلس لتخطي قيود الإطارات وتشغيل الأيقونات بكفاءة 100%
        window.location.replace(GAS_EXEC_URL);
    </script>
</body>
</html>
